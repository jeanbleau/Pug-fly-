
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pug Fly</title>
  <style>
    body { margin: 0; overflow: hidden; background: #70c5ce; font-family: sans-serif; }
    #startScreen, #gameOverScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); color: white; font-size: 2rem; z-index: 10;
    }
    button {
      font-size: 1.5rem; padding: 0.5em 1em; margin-top: 1em;
      border: none; border-radius: 10px; background: #ffcc00; color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>Pug Fly</h1>
    <button onclick="startGame()">¡Jugar ahora!</button>
  </div>
  <div id="gameOverScreen" style="display: none;">
    <div id="scoreText"></div>
    <button onclick="restartGame()">Reiniciar juego</button>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script>
    let canvas = document.getElementById('gameCanvas');
    let ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let startScreen = document.getElementById('startScreen');
    let gameOverScreen = document.getElementById('gameOverScreen');
    let scoreText = document.getElementById('scoreText');

    let gameStarted = false;
    let gameOver = false;
    let score = 0;
    let dogY = canvas.height / 2;
    let velocity = 0;
    let gravity = 0.5;
    let jump = -10;
    let pipes = [];

    function drawDog() {
      ctx.fillStyle = 'brown';
      ctx.beginPath();
      ctx.arc(100, dogY, 30, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPipes() {
      ctx.fillStyle = 'green';
      pipes.forEach(p => {
        ctx.fillRect(p.x, 0, 50, p.gapY);
        ctx.fillRect(p.x, p.gapY + 150, 50, canvas.height);
      });
    }

    function resetGame() {
      score = 0;
      dogY = canvas.height / 2;
      velocity = 0;
      pipes = [];
      for (let i = 0; i < 3; i++) {
        pipes.push({ x: canvas.width + i * 300, gapY: Math.random() * (canvas.height - 300) + 50 });
      }
    }

    function startGame() {
      startScreen.style.display = 'none';
      resetGame();
      gameStarted = true;
      gameLoop();
    }

    function endGame() {
      gameStarted = false;
      gameOver = true;
      scoreText.innerText = `¡Teo se estrelló! Puntuación: ${score}`;
      gameOverScreen.style.display = 'flex';
    }

    function restartGame() {
      gameOverScreen.style.display = 'none';
      resetGame();
      gameOver = false;
      gameStarted = true;
      gameLoop();
    }

    function gameLoop() {
      if (!gameStarted) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      velocity += gravity;
      dogY += velocity;

      if (dogY > canvas.height || dogY < 0) {
        endGame();
        return;
      }

      pipes.forEach(p => {
        p.x -= 4;
        if (p.x + 50 < 0) {
          p.x = canvas.width;
          p.gapY = Math.random() * (canvas.height - 300) + 50;
          score++;
        }
        if (100 > p.x && 100 < p.x + 50) {
          if (dogY < p.gapY || dogY > p.gapY + 150) {
            endGame();
            return;
          }
        }
      });

      drawDog();
      drawPipes();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', () => {
      if (gameStarted && !gameOver) velocity = jump;
    });

    window.addEventListener('touchstart', () => {
      if (gameStarted && !gameOver) velocity = jump;
    });
  </script>
</body>
</html>
